[project]
name = "m-soundpad"
version = "0.1.0"
description = "Desktop soundboard that plays clips into a virtual microphone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pynput>=1.7",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]

[project.scripts]
m-soundpad = "m_soundpad.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m_soundpad"]
